# Continuous integration. Only active if the repository is hosted on GitHub;
# locally the same steps are run by hand (see docs/01_toolchain.md).
#
# Job 1 builds the C++ engine and runs its GoogleTest suite (Linux + Windows).
# Job 2 builds the C++ engine again, then runs the Python tests, which include
# the back-to-back comparison C++ vs Python.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests (GoogleTest via CTest)
        run: ctest --test-dir build -C Release --output-on-failure

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build C++ engine (for the back-to-back tests)
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release -DEVDS_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel
      - name: Install package with dev tools
        run: python -m pip install -e ".[dev]"
      - name: Lint and format check (ruff)
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests (pytest)
        run: python -m pytest --cov=evdynasim --cov-report=term-missing
      - name: Smoke test of the command line tool
        run: evdynasim cycle --config configs/generic_ev.yaml --cycle nedc --engine cpp
