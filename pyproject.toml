[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evdynasim"
version = "1.1.0"
description = "Electric vehicle energy simulation, calibration and validation platform (Python + C++17)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Benfin Joseph" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
evdynasim = "evdynasim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]  # line length is handled by the formatter
